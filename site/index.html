<title>Busier or quieter?</title>
<meta name="description" content="A tiny neural network inside a Solana coin. It learns from the coin's own trades and calls, each hour, whether the next hour will be busier or quieter. Every call is scored in public beside a coin flip and a simple rule.">

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thepooter.fun/">
<meta property="og:title" content="Pooter: busier or quieter?">
<meta property="og:description" content="A tiny neural network inside a Solana coin. Each hour it calls whether the next hour will be busier or quieter, scored in public beside a coin flip and a simple rule.">
<meta property="og:image" content="https://thepooter.fun/og.png">
<meta property="og:image:width" content="1200">

<script>try { if (localStorage.getItem("hunch-look") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="home" aria-label="Back to the call"><canvas class="mark" width="13" height="13" aria-hidden="true"></canvas><span class="name" data-name></span></button>
    <button class="status pill sm">Not launched</button>
    <span class="grow"></span>
    <a class="theme social" href="https://x.com/Thepooterfun" target="_blank" rel="noopener" aria-label="Pooter on X">
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L1.9 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>
    </a>
    <button class="theme" aria-label="Light mode" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>
    </button>
  </header>

  <div class="notice"></div>

  <main class="main">
    <aside class="desk">
      <div class="speech"></div>
      <div class="me"></div>
      <nav class="keys" aria-label="Ask the coin"></nav>
    </aside>
    <div class="views"></div>
  </main>

  <footer class="foot"><p></p></footer>
</div>
</body>
</html>
