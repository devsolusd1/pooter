[package]
name = "hunch-tests"
version = "0.1.0"
edition = "2021"
description = "Runs the compiled Hunch program inside LiteSVM next to Meteora DBC's mainnet bytecode: the chain replay against site/core/chain.js, and a test per rule."
publish = false
# Lets Cargo pick dependency versions that build on the installed Rust.
resolver = "3"

# Kept out of the program's own crate so its dependency tree stays tiny.
[dependencies]
hunch = { path = "../hunch" }
hunch-net = { path = "../hunch-net" }
litesvm = "0.16"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
solana-account = "4"
solana-address = { version = "2", features = ["curve25519", "decode"] }
solana-clock = "3"
solana-instruction = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"
