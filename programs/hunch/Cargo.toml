[package]
name = "hunch"
version = "0.1.0"
edition = "2021"
description = "Hunch, version one, curve phase: a 10-8-8-1 integer network that learns from its own Meteora DBC pool and spends its fee budget only on buying and burning HUNCH."
license = "MIT"
publish = false

[lib]
name = "hunch"
crate-type = ["cdylib", "lib"]

[features]
# Test-only: the price-impact cap at 3% of sqrt_price instead of 1%, so a LiteSVM test can reach the
# post-swap check (revert above 1.0101x). Never deployed; build.sh puts it in deploy-wide/.
test-wide-impact-cap = []

[dependencies]
hunch-net = { path = "../hunch-net" }
pinocchio = { version = "0.11", default-features = false, features = ["cpi", "account-resize"] }

# Deploy rent is paid per byte, so the release build optimises for size.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
