[package]
name = "hunch-net-bench-tests"
version = "0.1.0"
edition = "2021"
description = "Runs the compiled hunch-net bench program inside LiteSVM: compute per step, and the VM's results against net.js."
publish = false
# Lets Cargo pick dependency versions that build on the installed Rust.
resolver = "3"

[dev-dependencies]
hunch-net = { path = "../hunch-net" }
hunch-net-bench = { path = "../hunch-net-bench" }
litesvm = "0.16"
sha2 = "0.10"
solana-account = "4"
solana-address = { version = "2", features = ["curve25519"] }
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
